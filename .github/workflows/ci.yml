name: CI – Meriam Raya (Godot 4)

on:
  push:
    branches:
      - master
      - "claude/**"
  pull_request:
    branches:
      - master

env:
  GODOT_VERSION: "4.3"
  GUT_VERSION: "9.3.0"

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: GUT Unit + Integration Tests (headless Godot)
  # Replaces Unity's EditMode + PlayMode test jobs.
  # ---------------------------------------------------------------------------
  test:
    name: GUT Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install GUT (v${{ env.GUT_VERSION }})
        run: |
          wget -q \
            "https://github.com/bitwes/Gut/releases/download/v${{ env.GUT_VERSION }}/gut_${{ env.GUT_VERSION }}.zip" \
            -O /tmp/gut.zip
          unzip -q /tmp/gut.zip -d .
          echo "GUT installed:"
          ls addons/gut/

      - name: Import project (registers class names)
        run: godot --headless --path . --import --quit || true

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run GUT tests (headless)
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          godot \
            --headless \
            --display-driver headless \
            --audio-driver Dummy \
            --path . \
            -s res://addons/gut/gut_cmdln.gd \
            -gconfig=res://tests/.gutconfig.json \
            -gjunit_xml_file=res://test-results/results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gut-test-results
          path: test-results/
          retention-days: 14

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-results/results.xml
          check_name: GUT Test Results
          fail_on_failure: true

  # ---------------------------------------------------------------------------
  # Job 2: Build (runs after tests pass)
  # Platforms: Linux, Windows, Web
  # Replaces Unity's game-ci/unity-builder matrix.
  # ---------------------------------------------------------------------------
  build:
    name: Build – ${{ matrix.preset }}
    runs-on: ubuntu-latest
    needs: test
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Linux"
            platform: linux
            output_dir: build/linux
            output_file: build/linux/MeriamRaya.x86_64
          - preset: "Windows Desktop"
            platform: windows
            output_dir: build/windows
            output_file: build/windows/MeriamRaya.exe
          - preset: "Web"
            platform: web
            output_dir: build/web
            output_file: build/web/index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-${{ matrix.platform }}-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd') }}
          restore-keys: |
            godot-import-${{ matrix.platform }}-
            godot-import-

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          mv /root/.local/share/godot/templates/${{ env.GODOT_VERSION }}.stable/* \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Import project assets (generates .godot/)
        run: godot --headless --path . --import --quit || true

      - name: Create output directory
        run: mkdir -p ${{ matrix.output_dir }}

      - name: Export – ${{ matrix.preset }}
        run: |
          godot \
            --headless \
            --path . \
            --export-release "${{ matrix.preset }}" \
            "${{ matrix.output_file }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ matrix.output_dir }}
          retention-days: 7
