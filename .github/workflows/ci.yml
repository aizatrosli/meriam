name: CI – Meriam Raya (Godot 4)

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
    branches:
      - main
      - master

env:
  GODOT_VERSION: "4.3"
  GUT_VERSION: "9.4.0"

jobs:

  # ---------------------------------------------------------------------------
  # Job 1: GUT Unit + Integration Tests (headless Godot)
  # Replaces Unity's EditMode + PlayMode test jobs.
  # ---------------------------------------------------------------------------
  test:
    name: GUT Tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install GUT (v${{ env.GUT_VERSION }})
        run: |
          wget -q \
            "https://github.com/bitwes/Gut/archive/refs/tags/v${{ env.GUT_VERSION }}.zip" \
            -O /tmp/gut.zip
          unzip -q /tmp/gut.zip -d /tmp/gut_src/
          mv /tmp/gut_src/Gut-${{ env.GUT_VERSION }}/addons/gut addons/gut
          echo "GUT installed:"
          ls addons/gut/

      - name: Import project (registers class names)
        run: godot --headless --path . --import --quit || true

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run GUT tests (headless)
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: |
          godot \
            --headless \
            --display-driver headless \
            --audio-driver Dummy \
            --path . \
            -s res://addons/gut/gut_cmdln.gd \
            -gconfig=res://tests/.gutconfig.json \
            -gjunit_xml_file=res://test-results/results.xml \
            -gexit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gut-test-results
          path: test-results/
          retention-days: 14

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: test-results/results.xml
          check_name: GUT Test Results
          fail_on_failure: true

  # ---------------------------------------------------------------------------
  # Job 2: Build (runs after tests pass)
  # Platforms: Linux, Windows, Web
  # Replaces Unity's game-ci/unity-builder matrix.
  # ---------------------------------------------------------------------------
  build:
    name: Build – ${{ matrix.preset }}
    runs-on: ubuntu-latest
    needs: test
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Linux"
            platform: linux
            output_dir: build/linux
            output_file: build/linux/MeriamRaya.x86_64
          - preset: "Windows Desktop"
            platform: windows
            output_dir: build/windows
            output_file: build/windows/MeriamRaya.exe
          - preset: "Web"
            platform: web
            output_dir: build/web
            output_file: build/web/index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot import cache
        uses: actions/cache@v4
        with:
          path: .godot/
          key: godot-import-${{ matrix.platform }}-${{ hashFiles('**/*.tscn', '**/*.tres', '**/*.gd') }}
          restore-keys: |
            godot-import-${{ matrix.platform }}-
            godot-import-

      - name: Set up export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          cp -r /root/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable \
                ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable

      - name: Import project assets (generates .godot/)
        run: godot --headless --path . --import --quit || true

      - name: Create output directory
        run: mkdir -p ${{ matrix.output_dir }}

      - name: Export – ${{ matrix.preset }}
        run: |
          godot \
            --headless \
            --path . \
            --export-release "${{ matrix.preset }}" \
            "${{ matrix.output_file }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: ${{ matrix.output_dir }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Smoke Test – Linux binary (ubuntu-latest, self-contained export)
  # Launches the exported game headlessly for 60 frames with --debug output.
  # A non-zero exit code or GDScript ERROR line in stdout = build is broken.
  # ---------------------------------------------------------------------------
  smoke-test-linux:
    name: Smoke Test – Linux Binary
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-linux
          path: build/linux

      - name: Make binary executable
        run: chmod +x build/linux/MeriamRaya.x86_64

      - name: Run smoke test – 60 frames headless (--debug)
        # --debug prints verbose GDScript output so any ERROR lines are visible.
        # --quit-after 60 runs the full boot sequence (autoloads + main_menu._ready)
        # then exits cleanly with code 0.  Any crash or missing resource exits non-zero.
        run: |
          build/linux/MeriamRaya.x86_64 \
            --headless \
            --display-driver headless \
            --audio-driver Dummy \
            --debug \
            --quit-after 60 \
            2>&1 | tee smoke_linux.log
          echo "Exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Fail on GDScript runtime errors
        if: always()
        run: |
          if grep -qE "^ERROR:|SCRIPT ERROR:|Attempt to call function|Invalid get index" smoke_linux.log; then
            echo "=== Runtime errors detected in Linux smoke run ==="
            grep -E "^ERROR:|SCRIPT ERROR:|Attempt to call function|Invalid get index" smoke_linux.log
            exit 1
          fi
          echo "No GDScript runtime errors detected."

      - name: Upload Linux smoke log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-linux
          path: smoke_linux.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 4: Smoke Test – Windows binary (windows-latest runner)
  # Mirrors the Linux smoke test but runs the .exe on a native Windows host.
  # --debug surfaces GDScript errors and resource loading failures in stdout.
  # ---------------------------------------------------------------------------
  smoke-test-windows:
    name: Smoke Test – Windows Binary
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: build/windows

      - name: Run smoke test – 60 frames headless (--debug)
        shell: pwsh
        run: |
          $proc = Start-Process `
            -FilePath "build\windows\MeriamRaya.exe" `
            -ArgumentList "--headless","--display-driver","headless","--audio-driver","Dummy","--debug","--quit-after","60" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput smoke_windows.log `
            -RedirectStandardError  smoke_windows_err.log
          Get-Content smoke_windows.log, smoke_windows_err.log | Tee-Object -FilePath smoke_windows_combined.log
          Write-Host "Exit code: $($proc.ExitCode)"
          exit $proc.ExitCode

      - name: Fail on GDScript runtime errors
        if: always()
        shell: pwsh
        run: |
          $errors = Select-String -Path smoke_windows_combined.log `
            -Pattern "^ERROR:|SCRIPT ERROR:|Attempt to call function|Invalid get index"
          if ($errors) {
            Write-Host "=== Runtime errors detected in Windows smoke run ==="
            $errors | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "No GDScript runtime errors detected."

      - name: Upload Windows smoke log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-windows
          path: smoke_windows_combined.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 5: Smoke Test – Web export (Playwright / Chromium)
  # Serves the WASM build behind COOP+COEP headers, loads it in a headless
  # Chromium, and asserts the canvas renders without fatal engine errors.
  # ---------------------------------------------------------------------------
  smoke-test-web:
    name: Smoke Test – Web Build (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (for CI scripts)
        uses: actions/checkout@v4

      - name: Download Web build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-web
          path: build/web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install Node dependencies
        run: npm install
        working-directory: scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: scripts

      - name: Start COOP/COEP HTTP server
        run: node scripts/serve_web_ci.js &

      - name: Wait for server to be ready
        run: npx wait-on http://127.0.0.1:8080 --timeout 15000
        working-directory: scripts

      - name: Run Playwright smoke test
        run: npx playwright test web_smoke.spec.js --reporter=list
        working-directory: scripts
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080

      - name: Upload Playwright screenshot + report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-web-screenshot
          path: scripts/test-results/
          retention-days: 7
