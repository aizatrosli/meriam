name: Release – Meriam Raya (Godot 4)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  GODOT_VERSION: "4.3"

jobs:

  # ---------------------------------------------------------------------------
  # Build release binaries for all target platforms
  # ---------------------------------------------------------------------------
  release-build:
    name: Release Build – ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Linux"
            platform: linux
            output_dir: build/linux
            output_file: build/linux/MeriamRaya.x86_64
          - preset: "Windows Desktop"
            platform: windows
            output_dir: build/windows
            output_file: build/windows/MeriamRaya.exe
          - preset: "Web"
            platform: web
            output_dir: build/web
            output_file: build/web/index.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          mv /root/.local/share/godot/templates/${{ env.GODOT_VERSION }}.stable/* \
             ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Import project assets
        run: godot --headless --path . --import || true

      - name: Create output directory
        run: mkdir -p ${{ matrix.output_dir }}

      - name: Export release – ${{ matrix.preset }}
        run: |
          godot \
            --headless \
            --path . \
            --export-release "${{ matrix.preset }}" \
            "${{ matrix.output_file }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-${{ matrix.platform }}
          path: ${{ matrix.output_dir }}

  # ---------------------------------------------------------------------------
  # Smoke Test – Linux release binary (ubuntu-latest)
  # Must pass before the GitHub Release is published.
  # Launches the exported binary headlessly with --debug for 60 frames,
  # verifying autoloads and main scene boot without crashes.
  # ---------------------------------------------------------------------------
  smoke-test-linux:
    name: Release Smoke Test – Linux Binary
    runs-on: ubuntu-latest
    needs: release-build

    steps:
      - name: Download Linux release artifact
        uses: actions/download-artifact@v4
        with:
          name: Release-linux
          path: build/linux

      - name: Make binary executable
        run: chmod +x build/linux/MeriamRaya.x86_64

      - name: Run smoke test – 60 frames headless (--debug)
        run: |
          build/linux/MeriamRaya.x86_64 \
            --headless \
            --display-driver headless \
            --audio-driver Dummy \
            --debug \
            --quit-after 60 \
            2>&1 | tee smoke_linux.log
          exit ${PIPESTATUS[0]}

      - name: Fail on GDScript runtime errors
        if: always()
        run: |
          if grep -qE "^ERROR:|SCRIPT ERROR:|Attempt to call function|Invalid get index" smoke_linux.log; then
            echo "=== Runtime errors in release Linux binary ==="
            grep -E "^ERROR:|SCRIPT ERROR:|Attempt to call function|Invalid get index" smoke_linux.log
            exit 1
          fi
          echo "No GDScript runtime errors detected."

      - name: Upload smoke log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-log-linux
          path: smoke_linux.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Smoke Test – Windows release binary (windows-latest runner)
  # Mirrors the Linux smoke test on a native Windows host with --debug.
  # ---------------------------------------------------------------------------
  smoke-test-windows:
    name: Release Smoke Test – Windows Binary
    runs-on: windows-latest
    needs: release-build

    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: Release-windows
          path: build/windows

      - name: Run smoke test – 60 frames headless (--debug)
        shell: pwsh
        run: |
          $proc = Start-Process `
            -FilePath "build\windows\MeriamRaya.exe" `
            -ArgumentList "--headless","--display-driver","headless","--audio-driver","Dummy","--debug","--quit-after","60" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput smoke_windows.log `
            -RedirectStandardError  smoke_windows_err.log
          Get-Content smoke_windows.log, smoke_windows_err.log |
            Tee-Object -FilePath smoke_windows_combined.log
          Write-Host "Exit code: $($proc.ExitCode)"
          exit $proc.ExitCode

      - name: Fail on GDScript runtime errors
        if: always()
        shell: pwsh
        run: |
          $errors = Select-String -Path smoke_windows_combined.log `
            -Pattern "^ERROR:|SCRIPT ERROR:|Attempt to call function|Invalid get index"
          if ($errors) {
            Write-Host "=== Runtime errors in release Windows binary ==="
            $errors | ForEach-Object { Write-Host $_.Line }
            exit 1
          }
          Write-Host "No GDScript runtime errors detected."

      - name: Upload smoke log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-log-windows
          path: smoke_windows_combined.log
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Create a GitHub Release and attach zipped builds
  # Replaces the Unity softprops/action-gh-release step.
  # Blocked until both Linux and Windows smoke tests pass.
  # ---------------------------------------------------------------------------
  github-release:
    name: Publish GitHub Release
    needs: [release-build, smoke-test-linux, smoke-test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip platform builds
        run: |
          cd artifacts
          for dir in Release-*/; do
            zip -r "${dir%/}.zip" "$dir"
          done
          ls -lh *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Release-*.zip
          generate_release_notes: true
          body: |
            ## Meriam Raya ${{ github.ref_name }} – Selamat Raya! 🎆

            Two-player co-operative meriam buluh (bamboo cannon) game.
            Kampung yard at night, Ramadan / Raya celebration.

            ### Cara Main / How to Play
            | Pemain / Player | Peranan / Role | Kawalan / Controls |
            |---|---|---|
            | Anak Sulung (Player 1) | Aim cannon barrel | W / S or Left Stick Y |
            | Anak Bongsu (Player 2) | Hold to load, press to fire | Space (hold) + Enter |

            ### Main Dalam Talian / Online Play
            1. Host clicks **Buat Bilik / Create Lobby** → share the join code
            2. Guest enters the code → clicks **Sertai Bilik / Join Lobby**
            3. Jom main! / Let's play!

            ### Platform Downloads
            | Platform | File |
            |---|---|
            | Windows | Release-windows.zip |
            | Linux | Release-linux.zip |
            | WebGL (Browser) | Release-web.zip |

            Built with **Godot 4.3** · GDScript · ENet online co-op
